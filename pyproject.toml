[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accident-report"
version = "0.1.0"
description = "AIインタビュー型・工場内事故報告書作成支援アプリ（完全オフライン）"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "numpy>=1.26",
    "sounddevice>=0.4",
    "faster-whisper>=1.1",
    "PySide6>=6.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
