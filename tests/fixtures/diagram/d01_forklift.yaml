# 架空の作図事例（実在の人物・事故とは無関係）
id: d01
title: フォークリフト後退時のシャッター柱接触
text: >-
  ・田中作業員は2.5トンのフォークリフトでパレットを搬出口まで運んだ。
  ・トラックの位置を確認するため一度停止し、向きを変えようとして後退した。
  ・後退中、フォークリフトの左後部（カウンターウェイト）がシャッターの柱に接触した。
  ・柱の横には空のフレコンが置いてあった。

# 作図用の追加質問への回答（質問ID → 選択肢）。ないものは「分からない」
drawing_answers:
  "confirm:*柱*": 左後
  "place:*フレコン*": 左後
  "frame:*": 運転席から見て
  "dist:*": 近く（1m くらい）

# 採点用の正解（種類で照合）
expected:
  entities: [フォークリフト, 柱, フレコン]
  motions:
    - {entity: フォークリフト, kind: 後退}
  contacts:
    - {entity: フォークリフト, part: 左後, target: 柱}
  relations:
    - {subject: 柱, reference: フォークリフト, direction: [左後, 後, 左]}
