# 架空の作図事例（実在の人物・事故とは無関係）
id: d02
title: ホイールローダー前進時の選別機接触
text: >-
  ・佐藤作業員はホイールローダーで廃棄物を選別機の投入口へ運んでいた。
  ・投入口の手前で右に旋回しながら前進したところ、バケットの右端が選別機の角に当たった。
  ・誘導員の山本作業員はホイールローダーの左後ろに立っていたが、選別機の角は見えていなかった。
  ・選別機の外装カバーがへこんだ。

drawing_answers:
  "frame:*": 運転席から見て
  "dist:*": 近く（1m くらい）
  "place:*選別機*": 右前

expected:
  entities: [ホイールローダー, 選別機, 誘導員]
  motions:
    - {entity: ホイールローダー, kind: [前進, 右旋回]}
  contacts:
    - {entity: ホイールローダー, part: [バケット, 右前], target: 選別機}
  relations:
    - {subject: 誘導員, reference: ホイールローダー, direction: [左後]}
    - {subject: 選別機, reference: ホイールローダー, direction: [右前, 前, 右]}
